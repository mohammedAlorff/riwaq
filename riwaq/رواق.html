<script type="text/babel" data-presets="react">
/* Shared student interface. Icons come from bundled Lucide. */
function arabicDigits(value) {
  return String(value).replace(/[0-9]/g, n => '٠١٢٣٤٥٦٧٨٩'[n]);
}
function relativeTimeAr(input) {
  if (!input) return '';
  const date = new Date(typeof input === 'string' ? input.replace(' ', 'T') : input);
  if (!Number.isFinite(date.getTime())) return '';
  const days = Math.floor((Date.now() - date.getTime()) / 86400000);
  if (days > 6) return date.toLocaleDateString('ar-SA', {calendar:'gregory', day:'numeric', month:'short'});
  const minutes = Math.max(0, Math.floor((Date.now() - date.getTime()) / 60000));
  if (minutes < 1) return 'الآن';
  return new Intl.RelativeTimeFormat('ar', {numeric:'auto'}).format(
    days > 0 ? -days : minutes >= 60 ? -Math.floor(minutes / 60) : -minutes,
    days > 0 ? 'day' : minutes >= 60 ? 'hour' : 'minute');
}
function Icon({name, size=20, stroke=1.7}) {
  const names = {home:'House', compass:'Compass', calendar:'CalendarDays', search:'Search', users:'Users',
    pin:'MapPin', clock:'Clock3', check:'Check', x:'X', 'arrow-right':'ArrowRight', 'arrow-left':'ArrowLeft',
    external:'ArrowUpLeft', image:'Image', refresh:'RefreshCw', grid:'LayoutGrid', shield:'ShieldCheck',
    pen:'PenLine', logout:'LogOut', chevron:'ChevronLeft', megaphone:'Megaphone', link:'Link',
    instagram:'Instagram', twitter:'AtSign', snapchat:'MessageCircle', tiktok:'Music2', telegram:'Send', spark:'Sparkles'};
  const node = window.lucide.icons[names[name] || 'Circle'];
  return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={stroke} strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
    {node[2].map(([tag, attrs], i) => React.createElement(tag, {...attrs, key:i}))}
  </svg>;
}
function Avatar({size='md', color, children, image, alt=''}) {
  const [failed, setFailed] = React.useState(false);
  React.useEffect(() => setFailed(false), [image]);
  return <span className={'avatar '+size} style={{background:color || '#17644b'}}>
    {image && !failed ? <img src={image} alt={alt} loading="lazy" onError={() => setFailed(true)}/> : children}
  </span>;
}
function Sidebar({route}) {
  const {clubs, events} = React.useContext(window.RiwaqData);
  return <aside className="sidebar" aria-label="القائمة الرئيسية">
    <a className="brand" href="#feed" aria-label="رواق، الرئيسية"><span className="brand-mark">ر</span><span><strong className="brand-name">رواق</strong><span className="brand-sub">مجتمع الأندية الجامعية</span></span></a>
    <div className="nav-section">مساحتك الجامعية</div>
    <nav className="nav">
      {[['feed','الرئيسية','home',null],['clubs','الأندية','compass',clubs.length],['events','الفعاليات','calendar',events.length]].map(([id,label,icon,count]) =>
        <a key={id} href={'#'+id} className={'nav-item '+(route===id?'active':'')} aria-current={route===id?'page':undefined}>
          <Icon name={icon}/><span>{label}</span>{count !== null && <span className="nav-count">{arabicDigits(count)}</span>}
        </a>)}
    </nav>
    <div className="sidebar-bottom">
      <div className="campus-seal"><Icon name="spark" size={22}/><p>شغفك له مكان.<br/><strong>وأثرُك يبدأ هنا.</strong></p></div>
      <div className="portal-links"><a href="presidents/"><Icon name="pen" size={17}/>بوابة رئيس النادي<Icon name="external" size={14}/></a><a href="admin/"><Icon name="shield" size={17}/>إدارة رواق<Icon name="external" size={14}/></a></div>
      <div className="sidebar-foot-note">جامعة الإمام محمد بن سعود<br/>الإسلامية</div>
    </div>
  </aside>;
}
function MainHead({title, sub, search, children}) {
  return <header className="main-head"><div className="heading-row"><div><div className="eyebrow">رواق / مجتمع الجامعة</div><h1>{title}</h1>{sub && <p className="sub">{sub}</p>}</div>
    {search && <label className="search"><Icon name="search" size={18}/><input type="search" aria-label={search.placeholder || 'البحث في رواق'} placeholder={search.placeholder || 'ابحث عن شيء يلهمك…'} value={search.value} onChange={e=>search.onChange(e.target.value)}/></label>}
    </div>{children}</header>;
}
function PostCard({post, club}) {
  const [expanded, setExpanded] = React.useState(false);
  const [failed, setFailed] = React.useState(false);
  if (!club) return null;
  const type = {announcement:'إعلان', event:'فعالية', post:'منشور'}[post.type] || 'منشور';
  const imageSrc = post.image ? (/^https?:\/\//.test(post.image) ? post.image : 'uploads/'+post.image.replace(/^\/?uploads\//,'')) : null;
  return <article className="post">
    <div className="post-head"><a className="post-author-link" href={'#clubs/'+encodeURIComponent(club.id)}>
      <Avatar color={club.color} image={club.image} alt={club.name}>{club.icon}</Avatar>
      <span><span className="post-author-name">{club.name}<span className="verified" title="نادي جامعي"><Icon name="check" size={11}/></span></span>
        <span className="post-meta">{club.college}<span>·</span>{relativeTimeAr(post.createdAt || post._createdAt) || post.time}</span></span>
    </a><span className={'post-type-pill '+post.type}><Icon name={post.type==='event'?'calendar':post.type==='announcement'?'megaphone':'pen'} size={13}/>{type}</span></div>
    <div className="post-body"><h2 className="post-title">{post.title}</h2><p className={'post-text '+(expanded?'expanded':'')}>{post.body}</p>
      {(post.body || '').length > 180 && <button className="text-action" onClick={()=>setExpanded(!expanded)} aria-expanded={expanded}>{expanded?'عرض أقل':'قراءة المزيد'}</button>}
      {imageSrc && !failed && <img className="post-photo" src={imageSrc} alt={post.title} loading="lazy" onError={()=>setFailed(true)}/>}
    </div>
    <div className="post-foot"><div className="post-tags">{(post.tags || []).map(t=><a key={t} href={'#feed?tag='+encodeURIComponent(t)}>{t.startsWith('#')?t:'#'+t}</a>)}</div>
      {post.externalUrl && <a className="text-action" href={post.externalUrl} target="_blank" rel="noopener noreferrer">{post.type==='event'?'رابط الفعالية':'افتح الرابط'}<Icon name="external" size={16}/></a>}
    </div>
  </article>;
}
function eventIsPast(ev) {
  return new Date(ev.date+'T'+(ev.time || '23:59:59')+'+03:00').getTime() < Date.now();
}
function FeedRail() {
  const {clubs,events,trendingTags} = React.useContext(window.RiwaqData);
  const upcoming = events.filter(e=>!eventIsPast(e)).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)).slice(0,3);
  return <aside className="rail" aria-label="حول مجتمع رواق">
    <section className="rail-section"><div className="section-label"><h2>على الموعد</h2><Icon name="calendar" size={18}/></div><p className="rail-sub">مساحة لتجربة جديدة</p>
      {upcoming.length ? upcoming.map(ev=><a className="event-row" href="#events" key={ev.id}><span className="date-block"><strong>{arabicDigits(Number(ev.date.slice(8,10)))}</strong><small>{new Date(ev.date+'T12:00:00').toLocaleDateString('ar-SA',{calendar:'gregory',month:'short'})}</small></span><span><strong>{ev.title}</strong><small>{ev.location}</small></span><Icon name="chevron" size={15}/></a>) : <div className="rail-empty">لا توجد فعاليات قادمة حاليًا.<br/>تبقى لقاءاتنا السابقة في الأرشيف.</div>}
      <a className="rail-more" href="#events">تقويم الفعاليات<Icon name="arrow-left" size={16}/></a>
    </section>
    <section className="rail-section"><div className="section-label"><h2>تعرّف على الأندية</h2><Icon name="compass" size={18}/></div>
      {clubs.slice(0,4).map(c=><a className="club-row" href={'#clubs/'+encodeURIComponent(c.id)} key={c.id}><Avatar size="sm" color={c.color} image={c.image}>{c.icon}</Avatar><span><strong>{c.name}</strong><small>{c.cat} · {arabicDigits(c.members)} عضو</small></span><Icon name="chevron" size={15}/></a>)}
      <a className="rail-more" href="#clubs">كل الأندية<Icon name="arrow-left" size={16}/></a>
    </section>
    <section className="rail-section"><div className="section-label"><h2>حديث المجتمع</h2></div><div className="trending-tags">{trendingTags.map(tag=><a href={'#feed?tag='+encodeURIComponent(tag)} key={tag}>{tag}</a>)}</div></section>
    <p className="rail-footer">رواق · حيث يلتقي الشغف بالأثر<br/>{new Date().getFullYear()} ©</p>
  </aside>;
}
function SocialLinks({socials={}}) {
  const labels={twitter:'X / تويتر',instagram:'إنستقرام',snapchat:'سناب شات',tiktok:'تيك توك',telegram:'تيليجرام'};
  return <div className="socials">{Object.entries(socials).filter(([key,v])=>labels[key] && /^https?:\/\//i.test(v.url || '')).map(([key,v])=><a className="social-card" href={v.url} target="_blank" rel="noopener noreferrer" aria-label={`${labels[key]}، ${v.handle || v.url}`} key={key}><span className="social-ico"><Icon name={key}/></span><span><strong>{labels[key]}</strong><small dir="ltr">{v.handle || v.url}</small></span><Icon name="external" size={18}/></a>)}</div>;
}
Object.assign(window,{Icon,Avatar,Sidebar,MainHead,PostCard,FeedRail,SocialLinks,arabicDigits,relativeTimeAr,eventIsPast});
</script>

<script type="text/babel" data-presets="react">
/* Screen components — public student portal (read-only)
 * تقرأ كل البيانات من RiwaqData context (لا أكثر من window.RIWAQ_DATA).
 */

// ====================================================================
// FEED SCREEN — feed with type/tag filters + search
// ====================================================================
function FeedScreen({ state, dispatch }) {
  const { clubs, posts } = React.useContext(window.RiwaqData);

  const clubMap = React.useMemo(
    () => Object.fromEntries(clubs.map(c => [c.id, c])),
    [clubs]
  );

  const [tab, setTab]     = React.useState("all");
  const [query, setQuery] = React.useState("");

  const q = query.trim().toLowerCase();
  const tagFilter = state.feedTag || null;

  const filtered = React.useMemo(() => posts.filter(p => {
    if (!clubMap[p.clubId]) return false;
    if (tab === "events"        && p.type !== "event")        return false;
    if (tab === "announcements" && p.type !== "announcement") return false;
    if (tab === "posts"         && p.type !== "post")         return false;
    if (tagFilter && !(p.tags && p.tags.includes(tagFilter))) return false;
    if (q) {
      const haystack = (
        (p.title || "") + " " +
        (p.body  || "") + " " +
        ((p.tags || []).join(" ")) + " " +
        (clubMap[p.clubId].name || "")
      ).toLowerCase();
      if (!haystack.includes(q)) return false;
    }
    return true;
  }), [posts, clubMap, tab, tagFilter, q]);

  return (
    <>
      <MainHead
        title="الرئيسية"
        sub={`أحدث ما يدور في أندية وفعاليات جامعة الإمام · ${arabicDigits(filtered.length)} منشور`}
        search={{ value: query, onChange: setQuery }}
      >
        <div className="tabs" role="tablist" aria-label="تصفية حسب النوع">
          {[
            { id: "all", label: "الكل" },
            { id: "announcements", label: "إعلانات" },
            { id: "events", label: "فعاليات" },
            { id: "posts", label: "منشورات" }
          ].map(t => (
            <button
              key={t.id}
              type="button"
              role="tab"
              aria-selected={tab === t.id}
              className={`tab ${tab === t.id ? "active" : ""}`}
              onClick={() => setTab(t.id)}
            >
              {t.label}
            </button>
          ))}
        </div>
      </MainHead>

      <div className="main-body">
        <section className="campus-feature" aria-label="مجتمع رواق">
          <img src="assets/campus.jpg" alt="مدخل جامعة الإمام محمد بن سعود الإسلامية"/>
          <div className="campus-feature-copy"><span>من قلب الجامعة</span><h2>كل شغفٍ يجد رواقه.</h2><p>أندية، أفكار، وفعاليات تصنع يومك الجامعي.</p><a href="#clubs">استكشف الأندية <Icon name="arrow-left" size={17}/></a></div>
        </section>
        <div className="feed-section-heading"><h2>من مجتمعنا</h2><span>{arabicDigits(filtered.length)} منشور</span></div>
        {tagFilter && (
          <div className="filter-bar" role="status">
            <span className="filter-bar-label">عرض المنشورات الموسومة بـ</span>
            <span className="filter-bar-tag">{tagFilter}</span>
            <button
              type="button"
              className="filter-bar-clear"
              onClick={() => dispatch({ type: "clearFeedTag" })}
              aria-label="إزالة الفلتر"
            >
              <Icon name="x" size={14}/>
              <span>إلغاء</span>
            </button>
          </div>
        )}

        {filtered.length === 0 ? (
          <div className="empty">
            <Icon name="compass" size={48} stroke={1.2}/>
            <div className="title">
              {q || tagFilter ? "لا منشورات تطابق البحث" : "لا منشورات هنا بعد"}
            </div>
            <div className="sub">
              {q || tagFilter
                ? "جرّب كلمة أخرى أو ألغِ الفلاتر"
                : "ستظهر هنا أحدث إعلانات وفعاليات أندية الجامعة فور نشرها"}
            </div>
          </div>
        ) : (
          filtered.map(p => (
            <PostCard
              key={p.id}
              post={p}
              club={clubMap[p.clubId]}
            />
          ))
        )}
      </div>
    </>
  );
}

// ====================================================================
// CLUBS SCREEN — browse all clubs
// ====================================================================
function ClubsScreen({ state, dispatch }) {
  const { clubs } = React.useContext(window.RiwaqData);
  const [cat, setCat] = React.useState("الكل");
  const [q, setQ]     = React.useState("");

  const cats = ["الكل", "تقني", "ثقافي", "شرعي", "أكاديمي", "رياضي", "إبداعي"];

  const query = q.trim().toLowerCase();
  const filtered = clubs.filter(c =>
    (cat === "الكل" || c.cat === cat) &&
    (query === "" ||
      c.name.toLowerCase().includes(query) ||
      (c.desc || "").toLowerCase().includes(query) ||
      (c.college || "").toLowerCase().includes(query))
  );

  return (
    <>
      <MainHead title="الأندية" sub={`اكتشف ${arabicDigits(clubs.length)} نادياً طلابياً في الجامعة`}/>
      <div className="main-body">
        <div className="clubs-filters">
          <div role="tablist" aria-label="تصفية حسب التصنيف" className="clubs-filter-tabs">
            {cats.map(c => (
              <button
                key={c}
                type="button"
                role="tab"
                aria-selected={cat === c}
                className={`tab ${cat === c ? "active" : ""}`}
                onClick={() => setCat(c)}
              >
                {c}
              </button>
            ))}
          </div>
          <label className="search clubs-search" aria-label="ابحث عن نادٍ">
            <Icon name="search" size={16}/>
            <input
              type="search"
              placeholder="ابحث عن نادٍ…"
              value={q}
              onChange={e => setQ(e.target.value)}
            />
          </label>
        </div>

        <div className="club-grid">
          {filtered.map(c => (
            <button
              key={c.id}
              type="button"
              className="club-card"
              onClick={() => dispatch({ type: "openClub", id: c.id })}
              aria-label={`فتح ${c.name}`}
            >
              <div className="club-cover" style={{ background: c.cover }}>
                <div className="club-cover-pattern" aria-hidden="true"></div>
                {c.image ? (
                  <div className="club-card-icon club-card-icon-image" aria-hidden="true">
                    <img src={c.image} alt="" loading="lazy"/>
                  </div>
                ) : (
                  <div className="club-card-icon" style={{ background: c.color }} aria-hidden="true">{c.icon}</div>
                )}
              </div>
              <div className="club-card-body">
                <span className="club-card-cat">{c.cat}</span>
                <div className="club-card-name">{c.name}</div>
                <div className="club-card-desc">{c.desc}</div>
                <div className="club-card-foot">
                  <div className="club-card-members">
                    <Icon name="users" size={14}/>
                    {arabicDigits(c.members)} عضو
                  </div>
                  <div className="club-card-college">{c.college}</div>
                </div>
              </div>
            </button>
          ))}
        </div>

        {filtered.length === 0 && (
          <div className="empty">
            <Icon name="search" size={42} stroke={1.2}/>
            <div className="title">لم نجد نادياً يطابق بحثك</div>
            <div className="sub">جرّب تصنيفًا أو كلمةً أخرى</div>
          </div>
        )}
      </div>
    </>
  );
}

// ====================================================================
// CLUB DETAIL — read-only: posts, events, socials, about
// ====================================================================
function ClubDetail({ clubId, state, dispatch, onBack }) {
  const { clubs, posts, events } = React.useContext(window.RiwaqData);
  const club = clubs.find(c => c.id === clubId);
  const [tab, setTab] = React.useState("posts");

  const clubMap = React.useMemo(
    () => Object.fromEntries(clubs.map(c => [c.id, c])),
    [clubs]
  );

  if (!club) {
    return (
      <div className="empty">
        <Icon name="search" size={42} stroke={1.2}/>
        <div className="title">لم نتمكن من العثور على هذا النادي</div>
        <div className="sub">قد يكون قد حُذف أو غُيّر معرّفه</div>
        <button type="button" className="btn btn-ghost" style={{ marginTop: 14 }} onClick={onBack}>
          العودة إلى الأندية
        </button>
      </div>
    );
  }

  const clubPosts  = posts.filter(p => p.clubId === clubId);
  const clubEvents = events.filter(e => e.clubId === clubId);
  const hasSocials = club.socials && Object.keys(club.socials).length > 0;

  return (
    <>
      <div className="main-head cd-main-head">
        <button
          type="button"
          className="icon-btn"
          onClick={onBack}
          title="رجوع إلى الأندية"
          aria-label="رجوع إلى الأندية"
        >
          <Icon name="arrow-right" size={18}/>
        </button>
        <div>
          <h1>{club.name}</h1>
          <div className="sub">{club.college} · {club.cat}</div>
        </div>
      </div>

      <div className="cd-cover" style={{ background: club.cover }} aria-hidden="true">
        <div className="cd-cover-pattern"></div>
      </div>
      <div className="cd-head">
        {club.image ? (
          <div className="cd-icon cd-icon-image" aria-hidden="true">
            <img src={club.image} alt="" loading="lazy"/>
          </div>
        ) : (
          <div className="cd-icon" style={{ background: club.color }} aria-hidden="true">{club.icon}</div>
        )}
        <div className="cd-name-block">
          <div className="cd-name">{club.name}</div>
          <div className="cd-meta">
            <span>{club.college}</span>
            <span aria-hidden="true">·</span>
            <span>{arabicDigits(club.members)} عضو</span>
          </div>
        </div>
      </div>

      <div className="cd-desc">{club.desc}</div>

      <div className="stats-row">
        <div className="stat-cell">
          <div className="stat-v">{arabicDigits(club.members)}</div>
          <div className="stat-l">عضو</div>
        </div>
        <div className="stat-cell">
          <div className="stat-v">{arabicDigits(clubPosts.length)}</div>
          <div className="stat-l">منشور</div>
        </div>
        <div className="stat-cell">
          <div className="stat-v">{arabicDigits(clubEvents.length)}</div>
          <div className="stat-l">فعالية</div>
        </div>
        <div className="stat-cell">
          <div className="stat-v">{hasSocials ? arabicDigits(Object.keys(club.socials).length) : "—"}</div>
          <div className="stat-l">حساب رسمي</div>
        </div>
      </div>

      <div className="cd-tabs" role="tablist" aria-label="أقسام النادي">
        {[
          { id: "posts",   label: "المنشورات" },
          { id: "events",  label: "الفعاليات" },
          { id: "socials", label: "حسابات النادي" },
          { id: "about",   label: "نبذة" }
        ].map(t => (
          <button
            key={t.id}
            type="button"
            role="tab"
            aria-selected={tab === t.id}
            className={`cd-tab ${tab === t.id ? "active" : ""}`}
            onClick={() => setTab(t.id)}
          >
            {t.label}
          </button>
        ))}
      </div>

      <div className="main-body">
        {tab === "posts" && (
          clubPosts.length === 0 ? (
            <div className="empty">
              <Icon name="compass" size={36} stroke={1.2}/>
              <div className="title">لا منشورات بعد</div>
              <div className="sub">سيُضيف النادي منشوراته وإعلاناته هنا قريباً</div>
            </div>
          ) : clubPosts.map(p => (
            <PostCard key={p.id} post={p} club={clubMap[p.clubId]}/>
          ))
        )}

        {tab === "events" && (
          clubEvents.length === 0 ? (
            <div className="empty">
              <Icon name="calendar" size={36} stroke={1.2}/>
              <div className="title">لا فعاليات قادمة</div>
              <div className="sub">تابع النادي لمعرفة فعالياته القادمة</div>
            </div>
          ) : (
            <div className="event-grid">
              {clubEvents.map(e => <EventCard key={e.id} ev={e} club={club} interactive={false}/>)}
            </div>
          )
        )}

        {tab === "socials" && (
          <div className="panel">
            <h3 className="panel-title">حسابات النادي</h3>
            <p className="panel-sub">تابع {club.name} على حساباته الرسمية في منصات التواصل.</p>
            {hasSocials ? (
              <SocialLinks socials={club.socials}/>
            ) : (
              <div className="empty" style={{ padding: 30 }}>
                <div className="title">لا توجد حسابات مسجّلة بعد</div>
              </div>
            )}
          </div>
        )}

        {tab === "about" && (
          <div className="panel">
            <h3 className="panel-title">عن {club.name}</h3>
            <p className="panel-text">{club.desc}</p>
            {hasSocials && <><h4 className="panel-subtitle">تواصل مع النادي</h4><SocialLinks socials={club.socials}/></>}
          </div>
        )}
      </div>
    </>
  );
}

// ====================================================================
// EVENT CARD — read-only event display with capacity progress
// ====================================================================
function EventCard({ ev, club, onOpenClub, interactive = true }) {
  const spots = Number(ev.spots) || 0;
  const taken = Math.min(spots, Math.max(0, Number(ev.taken) || 0));
  const pct   = spots > 0 ? Math.round((taken / spots) * 100) : 0;
  const full  = spots > 0 && taken >= spots;
  const past = eventIsPast(ev);

  const handleOpenClub = () => {
    if (!interactive) return;
    if (onOpenClub && club) onOpenClub(club.id);
  };

  // اشتق day/month من event_date (YYYY-MM-DD أو مفرّغ)
  const { d: dayLabel, m: monthLabel } = React.useMemo(() => {
    if (!ev.date || typeof ev.date !== "string") return { d: "", m: "" };
    const parts = ev.date.split("-");
    if (parts.length < 3) return { d: "", m: "" };
    const monthNames = ["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];
    const day = arabicDigits(parts[2]);
    const monthIdx = parseInt(parts[1], 10) - 1;
    const month = monthNames[monthIdx] || arabicDigits(parts[1]);
    return { d: day, m: month };
  }, [ev.date]);

  const displayDate = ev.date ? arabicDigits(ev.date.split("-").reverse().join("/")) : "";
  const displayTime = ev.time ? arabicDigits((ev.time || "").slice(0, 5)) : "";

  return (
    <article
      className={`event-card ${interactive ? "is-interactive" : ""} ${past ? "is-past" : ""}`}
      role={interactive ? "group" : undefined}
      aria-label={`فعالية ${ev.title}${club ? " · " + club.name : ""}`}
    >
      <div className="event-card-head">
        <div className="event-card-date" aria-hidden="true">
          <div className="d">{dayLabel}</div>
          <div className="m">{monthLabel}</div>
        </div>
        <div className="event-card-headtext">
          <div className="event-card-title">{ev.title}</div>
          {club && (
            interactive ? <button type="button" className="event-card-club event-card-club-link" onClick={handleOpenClub} aria-label={`عرض ${club.name}`}>
              <span className="event-card-club-dot" style={{ background: club.color }} aria-hidden="true"></span>
              {club.name}
            </button> : <div className="event-card-club"><span className="event-card-club-dot" style={{ background: club.color }} aria-hidden="true"></span>{club.name}</div>
          )}
        </div>
      </div>
      {past && <span className="event-state">انتهت الفعالية</span>}
      {ev.description && <p className="event-description">{ev.description}</p>}
      <div className="event-card-row"><span className="ico"><Icon name="calendar" size={14}/></span>{displayDate}</div>
      <div className="event-card-row"><span className="ico"><Icon name="clock"    size={14}/></span>{displayTime}</div>
      <div className="event-card-row"><span className="ico"><Icon name="pin"      size={14}/></span>{ev.location}</div>

      <div className="event-card-cap">
        <div className="event-card-cap-row">
          <span className="event-card-cap-label">
            <Icon name="users" size={13}/>
            <span>{arabicDigits(taken)} / {arabicDigits(spots)} مقعد</span>
          </span>
          <span className={`event-card-cap-pct ${full ? "full" : ""}`}>
            {full ? "مكتمل" : `${arabicDigits(pct)}%`}
          </span>
        </div>
        <div className="event-card-progress" aria-hidden="true">
          <div style={{ width: `${pct}%` }} className={full ? "full" : ""}></div>
        </div>
      </div>

      {ev.registrationUrl && !full && !eventIsPast(ev) && (
        <a
          className="btn btn-primary event-card-register"
          href={ev.registrationUrl}
          target="_blank"
          rel="noopener noreferrer nofollow"
          onClick={(e) => e.stopPropagation()}
        >
          <Icon name="external" size={14}/>
          <span>سجِّل في الفعالية</span>
        </a>
      )}
      {!ev.registrationUrl && !full && !eventIsPast(ev) && (
        <div className="event-card-open-attendance">
          <Icon name="users" size={13}/>
          <span>الحضور مفتوح · للتسجيل تواصل مع النادي عبر حساباته</span>
        </div>
      )}
    </article>
  );
}

// ====================================================================
// EVENTS SCREEN — read-only list of upcoming events
// ====================================================================
function EventsScreen({ state, dispatch }) {
  const { clubs, events } = React.useContext(window.RiwaqData);
  const [period, setPeriod] = React.useState("upcoming");
  const [query, setQuery] = React.useState("");
  const [clubId, setClubId] = React.useState("");
  const clubMap = React.useMemo(
    () => Object.fromEntries(clubs.map(c => [c.id, c])),
    [clubs]
  );
  const available = events.filter(e => clubMap[e.clubId]);
  const upcoming = available.filter(e => !eventIsPast(e));
  const pool = period === "upcoming" ? upcoming : available.filter(eventIsPast);
  const needle = query.trim().toLocaleLowerCase("ar");
  const hasFilters = !!(needle || clubId);
  const clearFilters = () => { setQuery(""); setClubId(""); };
  const shown = pool.filter(e => (!clubId || e.clubId === clubId) && (!needle ||
    [e.title, e.description, e.location, clubMap[e.clubId].name].some(value =>
      String(value || "").toLocaleLowerCase("ar").includes(needle))))
    .sort((a,b) => {
      const comparison = (a.date + (a.time || "")).localeCompare(b.date + (b.time || ""));
      return period === "upcoming" ? comparison : -comparison;
    });

  return (
    <>
      <MainHead title="الفعاليات" sub="لقاءات وورش وتجارب من أندية الجامعة"
        search={{value:query, onChange:setQuery, placeholder:"البحث في الفعاليات"}}>
        <div className="tabs" role="tablist" aria-label="الفترة">
          <button type="button" className={`tab ${period === "upcoming" ? "active" : ""}`} role="tab" aria-selected={period === "upcoming"} onClick={() => setPeriod("upcoming")}>القادمة <span className="tab-count">{arabicDigits(upcoming.length)}</span></button>
          <button type="button" className={`tab ${period === "past" ? "active" : ""}`} role="tab" aria-selected={period === "past"} onClick={() => setPeriod("past")}>السابقة <span className="tab-count">{arabicDigits(available.length - upcoming.length)}</span></button>
        </div>
      </MainHead>
      <div className="main-body">
        <div className="event-toolbar">
          <label className="select-field"><span>النادي المنظم</span><select aria-label="النادي المنظم" value={clubId} onChange={e => setClubId(e.target.value)}>
            <option value="">جميع الأندية</option>
            {clubs.map(club => <option key={club.id} value={club.id}>{club.name}</option>)}
          </select></label>
          <span className="result-count" role="status">{arabicDigits(shown.length)} فعالية</span>
          {hasFilters && <button type="button" className="text-action clear-filters" onClick={clearFilters}><Icon name="x" size={15}/>مسح الفلاتر</button>}
        </div>
        {shown.length === 0 ? (
          <div className="empty">
            <Icon name="calendar" size={42} stroke={1.2}/>
            <div className="title">{hasFilters ? "لا توجد فعاليات تطابق بحثك" : period === "upcoming" ? "لا فعاليات قادمة حاليًا" : "لا فعاليات سابقة"}</div>
            <div className="sub">{hasFilters ? "جرّب اسمًا آخر أو اختر جميع الأندية." : period === "upcoming" ? "تابع الإعلانات الجديدة، أو استعرض الفعاليات السابقة." : "ستظهر هنا الفعاليات بعد انتهائها."}</div>
            {!hasFilters && period === "upcoming" && events.some(eventIsPast) && <button className="btn btn-ghost" type="button" onClick={() => setPeriod("past")}>عرض الفعاليات السابقة</button>}
          </div>
        ) : (
          <div className="event-grid">
            {shown.map(e => (
              <EventCard
                key={e.id}
                ev={e}
                club={clubMap[e.clubId]}
                onOpenClub={(id) => dispatch({ type: "openClub", id })}
              />
            ))}
          </div>
        )}
      </div>
    </>
  );
}

// Make screens globally available
Object.assign(window, {
  FeedScreen, ClubsScreen, ClubDetail, EventsScreen, EventCard
});
</script>

     app.jsx (مدموج)

<script type="text/babel" data-presets="react">
/* Main App — public student portal (read-only)
 *
 * يحمّل البيانات من /api عند الإقلاع ويعرض أخطاء الاتصال لإعادة المحاولة.
 * البيانات التجريبية مخصصة لفتح الملف مباشرة أو للمعاينة الصريحة.
 */

const RiwaqData = React.createContext({
  clubs: [], posts: [], events: [],
  trendingTags: [],
  loading: true, error: null,
  demo: false, demoReason: null,
  reload: () => {},
});

const initialState = {
  route: "feed",
  clubDetailId: null,
  feedTag: null
};

function reducer(state, action) {
  switch (action.type) {
    case "openClub":
      return { ...state, route: "clubDetail", clubDetailId: action.id };
    case "backFromClub":
      return { ...state, route: "clubs", clubDetailId: null };
    case "setRoute":
      return { ...state, route: action.route, clubDetailId: null, feedTag: null };
    case "setFeedTag":
      return { ...state, route: "feed", clubDetailId: null, feedTag: action.tag };
    case "clearFeedTag":
      return { ...state, feedTag: null };
    default:
      return state;
  }
}

const DEFAULT_TRENDING = ["#هاكاثون", "#رواق", "#فعاليات", "#مناظرات", "#ريادة"];

function DemoBanner({ reason }) {
  const [hidden, setHidden] = React.useState(() => {
    try { return sessionStorage.getItem("riwaq.demo.banner.dismissed") === "1"; }
    catch (e) { return false; }
  });
  if (hidden) return null;

  const explain = (() => {
    switch (reason) {
      case "configuration_missing":
      case "not_json":
      case "network":
      case "database_unavailable":
        return "المنصة تعرض حالياً بيانات نموذجية — البيانات الحقيقية ستظهر عند تشغيل المنصة رسمياً.";
      default:
        return "أنت تشاهد بيانات نموذجية توضيحية. ستُحدَّث تلقائياً عند إطلاق المنصة رسمياً.";
    }
  })();

  const dismiss = () => {
    try { sessionStorage.setItem("riwaq.demo.banner.dismissed", "1"); } catch (e) {}
    setHidden(true);
  };

  return (
    <div className="demo-banner" role="status">
      <span className="demo-banner-icon" aria-hidden="true">●</span>
      <div className="demo-banner-text">
        <strong>وضع تجريبي</strong>
        <span>· {explain}</span>
      </div>
      <button
        type="button"
        className="demo-banner-dismiss"
        onClick={dismiss}
        aria-label="إخفاء التنبيه"
        title="إخفاء"
      >
        ✕
      </button>
    </div>
  );
}

function App() {
  const routeFromHash = React.useCallback(() => {
    const hash = location.hash.slice(1) || "feed";
    const [path, query] = hash.split("?");
    const detail = path.match(/^clubs\/(.+)$/);
    if (detail) {
      try { return { route: "clubDetail", clubDetailId: decodeURIComponent(detail[1]), feedTag: null }; }
      catch { return { ...initialState }; }
    }
    if (path === "clubs" || path === "events") return { route: path, clubDetailId: null, feedTag: null };
    return { route: "feed", clubDetailId: null, feedTag: new URLSearchParams(query || "").get("tag") };
  }, []);
  const [state, setState] = React.useState(routeFromHash);
  React.useEffect(() => {
    const sync = () => setState(routeFromHash());
    window.addEventListener("hashchange", sync);
    return () => window.removeEventListener("hashchange", sync);
  }, [routeFromHash]);
  const dispatch = React.useCallback(action => {
    const hash = action.type === "openClub" ? "clubs/" + encodeURIComponent(action.id) :
      action.type === "backFromClub" ? "clubs" :
      action.type === "setFeedTag" ? "feed?tag=" + encodeURIComponent(action.tag) :
      action.type === "clearFeedTag" ? "feed" :
      action.type === "setRoute" ? action.route : "feed";
    if (location.hash === "#" + hash) setState(routeFromHash());
    else location.hash = hash;
  }, [routeFromHash]);
  const [data, setData] = React.useState({
    clubs: [], posts: [], events: [],
    trendingTags: DEFAULT_TRENDING,
    loading: true, error: null,
    demo: false, demoReason: null,
  });

  const loadAll = React.useCallback(async () => {
    setData(d => ({ ...d, loading: true, error: null }));
    try {
      const [clubs, posts, events] = await Promise.all([
        window.RiwaqAPI.clubs.list(),
        window.RiwaqAPI.posts.list(),
        window.RiwaqAPI.events.list(),
      ]);
      const tagCount = {};
      posts.forEach(p => (p.tags || []).forEach(t => {
        tagCount[t] = (tagCount[t] || 0) + 1;
      }));
      const trending = Object.entries(tagCount)
        .sort((a, b) => b[1] - a[1])
        .slice(0, 6)
        .map(([t]) => t);
      setData({
        clubs, posts, events,
        trendingTags: trending.length > 0 ? trending : DEFAULT_TRENDING,
        loading: false, error: null,
        demo: !!window.RiwaqAPI.isDemo,
        demoReason: window.RiwaqAPI.demoReason || null,
      });
    } catch (e) {
      setData(d => ({
        ...d,
        loading: false,
        error: e && e.message ? e.message : "تعذّر تحميل البيانات.",
      }));
    }
  }, []);

  React.useEffect(() => { loadAll(); }, [loadAll]);

  // إعادة تحميل دورية فقط لو لسنا في وضع تجريبي
  React.useEffect(() => {
    if (data.demo) return;
    const id = setInterval(() => {
      if (!document.hidden) loadAll();
    }, 60000);
    return () => clearInterval(id);
  }, [loadAll, data.demo]);

  const ctx = React.useMemo(() => ({ ...data, reload: loadAll }), [data, loadAll]);
  const hideRail = state.route === "clubDetail";

  // شاشة تحميل أوّلي
  if (data.loading && data.clubs.length === 0) {
    return (
      <div className="app-loading">
        <div className="brand-mark brand-mark-large" aria-hidden="true">ر</div>
        <div className="app-loading-title">رواق</div>
        <div className="app-loading-sub">جاري تحميل البيانات…</div>
        <div className="spinner" aria-label="جاري التحميل"></div>
      </div>
    );
  }

  // شاشة خطأ (نادراً — فقط لو حتى Demo data غير متاحة)
  if (data.error && data.clubs.length === 0) {
    return (
      <div className="app-loading">
        <div className="brand-mark brand-mark-large" aria-hidden="true">ر</div>
        <div className="app-loading-title">تعذّر تحميل البيانات</div>
        <div className="app-loading-sub" style={{ maxWidth: 420 }}>{data.error}</div>
        <button type="button" className="btn btn-primary" onClick={loadAll} style={{ marginTop: 16 }}>
          إعادة المحاولة
        </button>
      </div>
    );
  }

  return (
    <RiwaqData.Provider value={ctx}>
      {data.demo && <DemoBanner reason={data.demoReason}/>}
      <div className={`app ${hideRail ? "no-right" : ""} ${data.demo ? "has-demo-banner" : ""}`}>
        <Sidebar
          route={state.route === "clubDetail" ? "clubs" : state.route}
          setRoute={r => dispatch({ type: "setRoute", route: r })}
        />
        <div className="workspace">
        <div className="workspace-bar"><span>جامعة الإمام محمد بن سعود الإسلامية</span><span className="workspace-bar-actions"><span>{new Date().toLocaleDateString("ar-SA", {calendar: "gregory", weekday: "long", day: "numeric", month: "long"})}</span><button type="button" onClick={loadAll} title="تحديث البيانات" aria-label="تحديث البيانات"><Icon name="refresh" size={16}/></button></span></div>
        <div className="content-layout">
        <main className="main">
          {data.error && <p role="alert">تعذّر تحديث البيانات: {data.error}</p>}
          {state.route === "feed" && (
            <FeedScreen state={state} dispatch={dispatch}/>
          )}
          {state.route === "clubs" && <ClubsScreen state={state} dispatch={dispatch}/>}
          {state.route === "clubDetail" && (
            <ClubDetail
              clubId={state.clubDetailId}
              state={state} dispatch={dispatch}
              onBack={() => dispatch({ type: "backFromClub" })}
            />
          )}
          {state.route === "events" && <EventsScreen state={state} dispatch={dispatch}/>}
        </main>
        {!hideRail && (
          <FeedRail
            onOpenClub={(id) => id ? dispatch({ type: "openClub", id }) : dispatch({ type: "setRoute", route: "clubs" })}
            onOpenEvents={() => dispatch({ type: "setRoute", route: "events" })}
            onSelectTag={(tag) => dispatch({ type: "setFeedTag", tag })}
          />
        )}
        </div>
        </div>
      </div>
    </RiwaqData.Provider>
  );
}

window.RiwaqData = RiwaqData;

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>

</body>
